# CI: testes (Python 3.11 e 3.12, como os Databricks Runtimes atuais) e verificação de segurança.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"  # toda segunda: pega vulnerabilidades novas nas dependências, mesmo sem commits
  workflow_dispatch:

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Instalar dependências (app + agente + dev)
        run: uv pip install --system -r requirements.txt -r requirements-agente.txt -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q -p no:warnings tests

  seguranca:
    name: Segurança · testes, bandit e pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - name: Instalar dependências (app + agente + dev)
        run: uv pip install --system -r requirements.txt -r requirements-agente.txt -r requirements-dev.txt
      - name: Atualizar pip e setuptools (o pip-audit também audita as ferramentas do ambiente)
        run: python -m pip install -q -U pip setuptools
      - name: Verificação de segurança
        run: scripts/seguranca.sh
